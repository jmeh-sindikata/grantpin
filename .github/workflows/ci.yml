name: ci

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: make ci
        run: make ci

  # The SwiftUI app: an unsigned xcodebuild build plus the Swift tests against
  # the Go dev daemon (INSECURE test backends, no signing, no Keychain). It
  # needs Xcode, which the macOS runner images ship; the image's default Xcode
  # is used, so a runner image whose Xcode is too old for the project shows up
  # here as a build failure, not as a silent skip.
  ci-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Xcode version
        run: xcodebuild -version
      - name: make ci-app
        run: make ci-app
